<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV — Acesso Restrito</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="noise"></div>

    <main class="login">

        <div class="login-symbol">
            PV
        </div>

        <p class="classified">PRIVATE // RESTRICTED // 07</p>

        <h1>PRIVET</h1>

        <p class="login-subtitle">
            arquivo narrativo confidencial
        </p>

        <div class="terminal">

            <div class="terminal-top">
                <span></span>
                <span></span>
                <span></span>
                <small>PV_SYSTEM</small>
            </div>

            <p class="terminal-text">
                IDENTIDADE NÃO VERIFICADA
            </p>

            <p class="terminal-text green">
                INSIRA A CHAVE DE ACESSO
            </p>

            <form action="inicio.html">

                <input
                    type="password"
                    name="senha"
                    placeholder="••••"
                    required
                    pattern="0007"
                    maxlength="4"
                    title="Código incorreto."
                >

                <button type="submit">
                    ENTRAR NO ARQUIVO
                </button>

            </form>

            <small class="warning">
                ⚠ SISTEMA FICCIONAL — ARQUIVO DE OBRA
            </small>

        </div>

        <p class="login-footer">
            “Cada ação há uma reação.”
        </p>

    </main>

</body>
</html>
